spring.application.name=ArchMain
server.port=${PORT:8081}

# Database: H2 file in ~/.archmain by default, so accounts and projects survive restarts. For PostgreSQL set
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/archmain
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.archmain/archmain-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# JWT – override ARCHMAIN_JWT_SECRET in production (min 32 bytes)
archmain.jwt.secret=${ARCHMAIN_JWT_SECRET:change-me-dev-secret-change-me-dev-secret-0123456789}
archmain.jwt.access-token-validity-ms=3600000
archmain.jwt.refresh-token-validity-ms=604800000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=ArchMain
info.app.description=Architecture Review Platform

# Comma-separated bootstrap administrator emails
archmain.admin-emails=${ARCHMAIN_ADMIN_EMAILS:}
